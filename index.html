<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Timeline</title>
    <meta name="description" content="A chronological timeline of important AI developments">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
    <header class="record-header">
        <div class="record-brand">
            <span class="record-wordmark">The AI Record</span>
            <span class="record-kicker">Tracking the timeline to AGI</span>
        </div>
        <span class="record-stat" id="record-stat"></span>
    </header>

    <!-- AI Market Tracker (collapsible, default collapsed) -->
    <div class="stock-chart-section">
        <button id="chart-toggle" class="chart-toggle-btn">
            <span class="chart-toggle-icon">&#9656;</span> AI Market Tracker
        </button>
        <div id="stock-chart-panel" class="stock-chart-panel" style="display:none">
            <!-- Stocks / Layoffs tab bar -->
            <div class="chart-tabs">
                <button class="chart-tab active" data-tab="stocks">Stocks</button>
                <button class="chart-tab" data-tab="layoffs">Layoffs</button>
            </div>
            <!-- Stocks tab panel -->
            <div class="chart-tab-panel" id="stocks-tab-panel">
                <div class="stock-chips-row">
                    <div class="stock-chips" id="stock-chips"></div>
                    <div class="chart-view-toggle" id="chart-resolution-toggle">
                        <button class="view-toggle-btn active" data-res="1D">1D</button>
                        <button class="view-toggle-btn" data-res="1W">1W</button>
                        <button class="view-toggle-btn" data-res="1M">1M</button>
                    </div>
                    <div class="chart-view-toggle" id="chart-view-toggle">
                        <button class="view-toggle-btn active" data-view="pct">% Change</button>
                        <button class="view-toggle-btn" data-view="abs">Absolute</button>
                    </div>
                </div>
                <div id="stock-chart-container" class="stock-chart-container"></div>
            </div>
            <!-- Layoffs tab panel -->
            <div class="chart-tab-panel" id="layoffs-tab-panel" style="display:none">
                <div id="layoff-chart-container" class="layoff-chart-container"></div>
            </div>
        </div>
    </div>

    <main class="record-main">
        <div id="atlas-dispatch"></div>
    </main>

    <script type="module" src="/src/js/app.js"></script>
</body>
</html>
