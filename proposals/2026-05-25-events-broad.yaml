- title: "Pope Leo XIV Issues First Papal Encyclical on Artificial Intelligence"
  date: "2026-05-25T10:00:00+02:00"
  description: "Pope Leo XIV published 'Magnifica Humanitas,' the Catholic Church's first-ever papal encyclical dedicated to artificial intelligence, signed on May 15 — exactly 135 years after Leo XIII's landmark Rerum Novarum on workers' rights during the Industrial Revolution. The encyclical was presented alongside Anthropic co-founder Christopher Olah at a Vatican ceremony, with the pope warning that AI carries 'even greater consequences than the Industrial Revolution' and that AI must serve humanity rather than concentrate power. The Vatican-Anthropic collaboration was described as 'unlikely' by religion journalists, and the encyclical's framing — AI as a question of human dignity rather than mere safety — introduced a new moral vocabulary to the governance debate, reaching 1.3 billion Catholics and drawing mainstream coverage from every major Western outlet."
  tags: ["Social", "Policy", "Safety"]
  organizations: ["Anthropic"]
  impact_areas: ["Ethics", "Public Perception", "Regulation"]
