- title: "NextEra Acquires Dominion Energy for $67B to Power AI Data Centers"
  date: "2026-05-18T08:00:00-05:00"
  description: "NextEra Energy announced an all-stock acquisition of Dominion Energy valued at ~$67 billion — the largest utility merger in U.S. history — with AI-driven electricity demand as the explicit strategic rationale. Dominion powers Northern Virginia, the world's largest data center concentration, where hyperscalers (Microsoft, Google, Amazon, Meta) have pushed electricity demand to unprecedented levels. The combined entity would own 74.5% by NextEra shareholders and 25.5% by Dominion investors, creating the largest regulated utility in the world and effectively making AI data center buildout the primary driver of major U.S. energy infrastructure M&A."
