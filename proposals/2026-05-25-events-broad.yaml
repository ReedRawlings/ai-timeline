- title: "OpenAI Model Autonomously Disproves 80-Year-Old Geometry Conjecture"
  date: "2026-05-23T10:00:00-07:00"
  description: "OpenAI's internal research model autonomously disproved a geometry conjecture that had stumped mathematicians for 80 years, producing a complete formal proof without human guidance. Fields Medal winner Tim Gowers described the result as 'a milestone in AI mathematics.' The breakthrough follows a trend of AI systems exceeding expert human performance on frontier mathematical problems and represents a qualitative capability leap beyond prior benchmark-passing results — suggesting AI is beginning to contribute to the actual frontier of human mathematical knowledge rather than recapitulating known results."
