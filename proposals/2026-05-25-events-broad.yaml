- title: "Jury Dismisses All Claims in Musk's $150B Lawsuit Against OpenAI"
  date: "2026-05-19T14:00:00-07:00"
  description: "A California federal jury deliberated for less than two hours before unanimously rejecting all of Elon Musk's claims in his $150 billion lawsuit against OpenAI, CEO Sam Altman, and President Greg Brockman. The jury found Musk had waited too long to file — the statute of limitations had expired — without reaching the underlying question of whether OpenAI betrayed its founding nonprofit mission. Judge Yvonne Gonzalez Rogers accepted the verdict and dismissed the case. The ruling closed the most high-profile legal challenge to OpenAI's for-profit conversion, though Musk's team immediately signaled an appeal. OpenAI filed its confidential IPO prospectus three days later."
  tags: ["Policy", "Corporate"]
  organizations: ["OpenAI"]
