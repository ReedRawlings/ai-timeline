- title: "Andrej Karpathy Joins Anthropic's Pretraining Team"
  date: "2026-05-19T09:00:00-07:00"
  description: "Andrej Karpathy — OpenAI co-founder, former Tesla Autopilot AI lead, and one of the most recognized AI researchers in the world — announced he had joined Anthropic to build a new team focused on using Claude itself to accelerate pretraining research. Karpathy will report to Nick Joseph, Anthropic's Head of Pretraining, and represents the most high-profile individual talent acquisition in the AI industry in 2026. The move is a significant signal of Anthropic's gravitational pull among elite researchers and comes as the company simultaneously courts a $900B valuation, publicly limited its most dangerous model, and forged partnerships with both the Gates Foundation and the Vatican."
