- title: "Trump Pulls AI Executive Order After Last-Minute Lobbying by Sacks, Musk, and Zuckerberg"
  date: "2026-05-21T09:00:00-05:00"
  description: "President Trump abruptly postponed signing an AI executive order — even as tech executives had already traveled to Washington for the signing ceremony — after a last-minute phone call campaign led by David Sacks, who argued that any voluntary government review framework would eventually harden into mandatory controls and cede ground to China. Elon Musk and Mark Zuckerberg placed similar calls. The withdrawn order would have required AI companies to share frontier models with the government up to 90 days before public launch, and had been drafted in direct response to Anthropic's Mythos model — which the company itself had declined to release due to its unprecedented cyber-attack capabilities. The episode was the most dramatic demonstration yet of tech industry influence over AI policy under the Trump administration."
  tags: ["Policy", "Safety"]
  organizations: ["OpenAI", "Anthropic", "Meta"]
  impact_areas: ["Regulation", "Ethics", "Market Competition"]
