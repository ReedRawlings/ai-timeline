- title: "OpenAI Codex Can Now Control Your Mac While the Screen Is Locked"
  date: "2026-05-22T09:00:00-07:00"
  description: "OpenAI announced 'Locked Use' for its Codex desktop agent on Mac — the ability to operate apps and execute long-running coding tasks autonomously after the user locks their screen, monitored and triggered remotely from a phone. The feature uses an Apple authorization plug-in that grants a time-limited, scoped session to Codex alone, requiring per-app permission grants and logging every action taken. Codex becomes the first commercial AI agent shipping with the capability to operate a personal computer fully unattended during a locked state, a milestone in the trajectory from copilot to autonomous agent. The feature is unavailable in the EU, UK, and Switzerland at launch."
  tags: ["Product", "Technical"]
  organizations: ["OpenAI"]
  models: ["Codex"]
  impact_areas: ["Market Competition", "Enterprise AI"]
  link: "https://www.macrumors.com/2026/05/22/codex-use-mac-apps-when-locked/"

- title: "OpenAI Files Confidential IPO Prospectus with the SEC"
  date: "2026-05-22T16:00:00-04:00"
  description: "OpenAI filed its confidential S-1 IPO prospectus with the SEC on Friday May 22, targeting a Q4 2026 public listing at a valuation between $852 billion and $1 trillion, with Goldman Sachs and Morgan Stanley leading the deal. The filing arrives despite the company losing $1.22 for every $1 of revenue in Q1 2026, and comes three days after the dismissal of Musk's lawsuit and amid Anthropic's own $900B valuation fundraise. The S-1 will become public on SEC EDGAR at least 15 days before the roadshow — expected around August 2026 — setting up the highest-stakes technology IPO since Meta's 2012 listing."
