- title: "Anthropic in Talks to Raise $30B at $900B Valuation — Surpassing OpenAI"
  date: "2026-05-23T09:00:00-07:00"
  description: "Anthropic entered final discussions to raise at least $30 billion in new financing at a post-money valuation exceeding $900 billion, which would make it the most valuable private AI startup in the world, surpassing OpenAI's $852 billion valuation. Sequoia Capital, Dragoneer, Altimeter, and Greenoaks are each expected to contribute ~$2 billion as co-leads, with Peter Thiel's Founders Fund and General Catalyst also participating. The round would represent an extraordinary escalation from Anthropic's $61.5 billion valuation in March 2025, $183 billion in September, and $380 billion in February 2026 — a nearly 15x increase in 14 months — and arrives as the company simultaneously manages a dangerous unreleased model, an ongoing Pentagon lawsuit, a Gates Foundation global health partnership, and the Karpathy hire."
