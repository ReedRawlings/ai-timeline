- title: "Meta's AI Employee-Tracking Program Goes Viral During 8,000-Person Layoff"
  date: "2026-05-20T09:00:00-07:00"
  description: "Leaked audio from a Meta all-hands meeting revealed that Mark Zuckerberg described the Model Capability Initiative (MCI), a program that monitored employee activity on Gmail, Google Chat, and internal tools to train Meta's AI models — on the same day approximately 8,000 Meta employees received layoff notices. The phrase 'train your replacement culture' spread across social media alongside 'Black Mirror episode' comparisons, with the story reaching the top of Reddit's r/technology and r/artificial. The episode crystallized public anxiety about AI displacing the very workers whose data and labor trains it, and was described by labor researchers as the starkest real-world example yet of the dual-use nature of employee AI tools."
  tags: ["Social", "Corporate", "Economic"]
  organizations: ["Meta"]
  impact_areas: ["Public Perception", "Ethics", "Market Competition"]
