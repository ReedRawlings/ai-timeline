- title: "EU Agrees AI Act Omnibus: Simplified Rules, Banned Nudification Apps"
  date: "2026-05-07T14:00:00+02:00"
  tags: ["Policy", "Regulation", "Safety"]
  impact_areas: ["Regulation", "Ethics", "Enterprise AI"]
  link: "https://www.consilium.europa.eu/en/press/press-releases/2026/05/07/artificial-intelligence-council-and-parliament-agree-to-simplify-and-streamline-rules/"
  description: "The European Parliament and Council of the EU reached a provisional agreement on the Digital Omnibus AI package, significantly amending the EU AI Act to ease compliance burdens while adding targeted prohibitions. High-risk AI system deadlines were extended — Annex III systems to December 2027 and Annex I embedded systems to August 2028 — and small mid-cap companies gained exemptions previously reserved for SMEs. The agreement added explicit prohibitions on AI systems that generate child sexual abuse material or non-consensual intimate imagery, with a December 2026 compliance date. The Omnibus represented the EU's first formal acknowledgement that its flagship AI law had imposed commercially unworkable timelines, coming six months after member states had begun lobbying for relief."

- title: "Colorado Repeals and Replaces Its Landmark AI Law"
  date: "2026-05-14T10:00:00-06:00"
  tags: ["Policy", "Regulation"]
  impact_areas: ["Regulation", "Ethics"]
  key_figures: ["Jared Polis"]
  link: "https://www.hklaw.com/en/insights/publications/2026/05/colorado-governor-signs-sb-189"
  description: "Colorado Governor Jared Polis signed SB 26-189, fully repealing and reenacting the state's original Colorado AI Act (SB 205) — which had been the first U.S. law imposing broad duties on high-risk AI systems and had attracted a lawsuit from xAI and the Justice Department. The replacement law eliminated mandatory risk management programs aligned to NIST AI RMF, annual impact assessments, and self-reporting requirements for algorithmic discrimination, replacing them with a narrower disclosure-and-transparency framework requiring only that companies notify users when AI influences consequential decisions. The retreat signaled the limits of early-mover state AI regulation: after surviving legislative battles, Colorado's landmark law had been effectively gutted under industry and federal pressure before its 2027 implementation date."

