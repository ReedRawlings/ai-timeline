  description: "Anthropic announced Project Glasswing — a restricted program giving AWS, Apple, Broadcom, Cisco, CrowdStrike, Google, JPMorganChase, the Linux Foundation, Microsoft, NVIDIA, and Palo Alto Networks access to Claude Mythos Preview, an unreleased AI model capable of autonomously discovering and chaining zero-day software exploits. The program was designed to use Mythos's vulnerability-finding capability for defense before the model, or a comparable system from another lab, became available to attackers. Anthropic withheld the model from the public due to misuse risk, representing the industry's first structured safety program in which a frontier AI capability is deliberately bottled for coordinated institutional deployment rather than general release."

- title: "Appeals Court Reverses Anthropic Preliminary Injunction, Pentagon Blacklist Reinstated"
  date: "2026-04-08T09:00:00-05:00"
  tags: ["Policy", "Corporate"]
  organizations: ["Anthropic", "Pentagon"]
  impact_areas: ["Regulation", "Ethics"]
  key_figures: ["Dario Amodei", "Pete Hegseth"]
  link: "https://www.cnbc.com/2026/04/08/anthropic-pentagon-court-ruling-supply-chain-risk.html"
  description: "A federal appeals court in Washington, D.C., denied Anthropic's emergency motion to reinstate the preliminary injunction blocking the Pentagon's national security designation, allowing the DOD's supply chain risk classification to remain in effect while the case proceeds to a full merits hearing. The reversal meant Anthropic remained — alongside foreign adversaries — on the government's supply chain exclusion list, restricting its ability to win new federal contracts. The divided appellate panel signaled that the First Amendment retaliation question would need a full record to resolve, setting up a major test of whether the executive branch can use national security designations to punish AI companies for their published ethical policies."

