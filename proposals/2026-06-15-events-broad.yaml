  description: "Anthropic released Claude Fable 5, a Mythos-class model made available to Pro, Max, Team, and Enterprise subscribers — the first time capability at that level had been publicly released. To make release possible, Anthropic implemented hard safety fallbacks: in high-risk categories including offensive cybersecurity, biology, chemistry, and radiological topics, Fable 5 silently degrades to Claude Opus 4.8. The model was simultaneously the company's most powerful public system and an explicit demonstration of capability elision as a safety mechanism, with Anthropic publishing detailed documentation of exactly which domains were capped and why. Fable 5 came priced at $10 per million input tokens and $50 per million output — roughly 2x Opus pricing — with Mythos 5 remaining restricted to Project Glasswing partners."

- title: "US Government Issues Export Directive Banning Claude Fable 5 and Mythos 5 for Foreign Nationals"
  date: "2026-06-13T09:00:00-07:00"
  tags: ["Policy", "Safety", "Corporate"]
  organizations: ["Anthropic"]
  models: ["Claude Fable 5", "Claude Mythos 5"]
  impact_areas: ["Regulation", "Market Competition", "Ethics"]
  key_figures: ["Dario Amodei"]
  link: "https://time.com/article/2026/06/13/anthropic-fable-mythos-ban-US-security/"
  description: "The US Commerce Department issued an export control directive ordering Anthropic to immediately suspend access to Claude Fable 5 and Mythos 5 for all foreign nationals — including Anthropic's own non-citizen employees — citing national security concerns about the models' code-analysis capabilities. Because Anthropic had no real-time mechanism to filter users by citizenship, it took both models offline for everyone globally, just four days after their launch. The action was the first time the US government had applied retroactive export controls to a commercially released AI model, representing a new use of the export control regime as an AI governance tool. Anthropic publicly characterized the directive as a misunderstanding and said it was working urgently to restore access, while critics noted the episode exposed the legal fragility of any AI product release when national security authorities can compel immediate global withdrawal."
