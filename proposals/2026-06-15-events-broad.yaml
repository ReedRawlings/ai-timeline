- title: "EU Parliament Votes to Delay AI Act High-Risk Deadlines"
  date: "2026-03-26T12:00:00+01:00"
  tags: ["Policy"]
  impact_areas: ["Regulation", "Enterprise AI", "Ethics"]
  link: "https://www.cio.com/article/4150989/european-parliament-delays-implementation-of-parts-of-the-eu-ai-act.html"
  description: "The European Parliament voted 569 to 45 to pass the EU AI Act Omnibus, which extended the compliance deadline for stand-alone high-risk AI systems from August 2, 2026 to December 2, 2027, and pushed AI systems embedded in regulated products to August 2, 2028 — a 16-month delay secured through the Digital Omnibus package. The extension followed sustained lobbying by industry groups who argued the original timeline was unachievable and risked pushing AI development outside the EU. It represented the first major rollback of the EU AI Act since its 2024 passage and signaled that even the most ambitious AI regulatory regime was bending under market pressure."

- title: "Anthropic Wins First Amendment Ruling Against Pentagon Blacklisting"
  date: "2026-03-26T09:00:00-08:00"
  tags: ["Policy", "Safety", "Corporate"]
  organizations: ["Anthropic", "Pentagon"]
  impact_areas: ["Regulation", "Ethics"]
  key_figures: ["Dario Amodei", "Pete Hegseth"]
  link: "https://www.cnbc.com/2026/03/26/anthropic-pentagon-dod-claude-court-ruling.html"
  description: "Federal Judge Rita Lin in San Francisco granted Anthropic a preliminary injunction blocking the Trump administration from enforcing the Pentagon's national security supply chain designation against the company, writing that 'punishing Anthropic for bringing public scrutiny to the government's contracting position is classic illegal First Amendment retaliation.' The ruling was the first time a federal court applied First Amendment protections to shield an AI company from executive branch retaliation over its published safety policies. Anthropic had refused Pentagon demands to allow Claude for use with lethal autonomous weapons and mass domestic surveillance; the DOD responded by designating it a national security threat — a designation historically reserved for foreign adversaries."

