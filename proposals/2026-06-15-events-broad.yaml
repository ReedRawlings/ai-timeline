  description: "Meta released Llama 5, a 600-billion-parameter open-weight model with a 5-million-token context window that matched or exceeded OpenAI's GPT-5.4 and Google's Gemini 3.1 Pro on major benchmarks — while being fully downloadable and locally runnable. The model introduced Recursive Self-Improvement (RSI), a training technique that enables the model to identify errors in its own chain-of-thought reasoning and self-correct without external feedback. The release continued Meta's strategy of maintaining open-weight parity with closed-source frontier models and represented the most capable openly available model at the time of release, intensifying the structural tension between open and closed AI development."

