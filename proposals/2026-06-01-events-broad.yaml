- title: "Sanders and AOC Introduce AI Data Center Moratorium Act"
  date: "2026-03-25T10:00:00-05:00"
  description: "Senator Bernie Sanders and Rep. Alexandria Ocasio-Cortez introduced the Artificial Intelligence Data Center Moratorium Act, calling for a nationwide halt on new AI data center construction until federal safeguards for workers, the environment, and civil rights are enacted. The bill is unlikely to pass in either chamber but galvanized progressive political opposition to unchecked AI infrastructure expansion and generated significant national coverage, marking a new phase of congressional pushback on AI's physical footprint."
