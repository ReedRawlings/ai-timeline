- title: "New York Governor Signs RAISE Act — First Frontier AI Safety Law in the US"
  date: "2026-03-27T10:00:00-05:00"
  description: "New York Governor Kathy Hochul signed the final chapter-amended version of the Responsible AI Safety and Education (RAISE) Act, the first state law in the US to impose specific safety and transparency obligations on frontier AI model developers. The law requires frontier developers operating in New York to establish and publish safety protocols, grants rulemaking authority to a new office within the state's Department of Financial Services, and authorizes the attorney general to levy civil penalties up to $3 million per violation. The law takes effect January 1, 2027."
  tags: ["Policy", "Safety"]
  organizations: ["New York State"]
  key_figures: ["Kathy Hochul"]
  impact_areas: ["Regulation", "Language Models"]
  link: "https://www.governor.ny.gov/news/governor-hochul-signs-nation-leading-legislation-require-ai-frameworks-ai-frontier-models"

- title: "Anthropic Claude Code Source Code Accidentally Leaked via npm Source Map"
  date: "2026-03-31T09:00:00-07:00"
  description: "Security researcher Chaofan Shou discovered that Anthropic's Claude Code CLI had accidentally shipped its entire 512,000-line TypeScript source to the public npm registry via a misconfigured source map file in version 2.1.88. The codebase was mirrored across GitHub and analyzed by thousands of developers within hours, exposing internal analytics systems, engineering culture details, and random identifiers filtered to exclude profanity. Anthropic confirmed the incident as 'a release packaging issue caused by human error, not a security breach' and pulled the package. A separate unrelated supply-chain attack on the axios npm package—a Claude Code dependency—occurred on the same day."
  tags: ["Technical", "Social"]
  organizations: ["Anthropic"]
  impact_areas: ["Public Perception", "Open Source"]
  link: "https://venturebeat.com/technology/claude-codes-source-code-appears-to-have-leaked-heres-what-we-know"

- title: "Goldman Sachs Reports AI Is Displacing 16,000 US Jobs Per Month"
  date: "2026-04-06T09:00:00-05:00"
  description: "Goldman Sachs Global Investment Research published the first major Wall Street analysis to isolate AI's net contribution to US job displacement from broader macroeconomic factors, estimating automation was eliminating approximately 16,000 net jobs per month — 25,000 displaced minus 9,000 created through augmentation. The report identified Gen Z workers as disproportionately affected, concentrated in white-collar routine roles most exposed to AI substitution, and projected monthly displacement to rise to 22,000–28,000 by Q4 2026 as multimodal agents move from pilot to full-scale enterprise deployment."
  tags: ["Economic", "Social"]
  organizations: ["Goldman Sachs"]
  impact_areas: ["Public Perception", "Enterprise AI"]
  link: "https://fortune.com/2026/04/06/ai-tech-displacement-effect-gen-z-16000-jobs-per-month/"

- title: "Anthropic Announces Mythos Preview — First Frontier Model Withheld as Too Dangerous to Deploy"
  date: "2026-04-07T09:00:00-07:00"
  description: "Anthropic announced Claude Mythos Preview, marking the first time a major AI lab publicly withheld a completed frontier model from general release on safety grounds. Mythos demonstrated the ability to autonomously identify and generate working exploits for thousands of zero-day vulnerabilities across every major operating system and web browser — achieving a 73% success rate on expert-level hacking tasks per the UK AI Security Institute. Rather than a public launch, Anthropic launched Project Glasswing, providing controlled access to over 40 critical infrastructure organizations including Microsoft, Google, Apple, AWS, JPMorgan Chase, and Nvidia for defensive cybersecurity use."
  tags: ["Safety", "Model", "Corporate"]
  organizations: ["Anthropic", "Microsoft", "Google", "Apple", "Amazon", "JPMorgan Chase", "Nvidia"]
