- title: "All Major US Frontier Labs Now Subject to Government Pre-Release AI Testing"
  date: "2026-05-05T09:00:00-05:00"
  description: "The Center for AI Standards and Innovation (CAISI) signed new pre-release testing agreements with Google DeepMind, Microsoft, and xAI, completing a framework in which every major US frontier AI lab now provides federal evaluators early model access before public launch. The agreements give government reviewers independent capability and national-security assessments not reliant on labs' own characterizations. The arrangement was catalyzed by the Mythos cybersecurity episode the prior month pushing the White House to formalize a review process. CAISI had already run over 40 evaluations, including on unreleased models."
  tags: ["Policy", "Safety"]
  organizations: ["Anthropic", "OpenAI", "Google", "Microsoft", "xAI", "US Department of Commerce"]
  impact_areas: ["Regulation", "Language Models"]
  link: "https://www.cnbc.com/2026/05/05/ai-oversight-trump-google-microsoft-xai.html"

- title: "Google I/O 2026: Gemini Declared the Layer for Every Google Product"
  date: "2026-05-19T10:00:00-07:00"
  description: "At Google I/O 2026, Sundar Pichai announced that Gemini would stop being a standalone product and instead underpin every Google surface — Android, Chrome, Search, Workspace, and YouTube — the most explicit declaration by a major platform company of AI as foundational infrastructure. New launches included Gemini 3.5 Flash (outperforming Gemini 3.1 Pro on benchmarks at Flash latency), Gemini Omni (native video generation grounded in real-world knowledge), Ask YouTube (conversational AI search across YouTube), Managed Agents, and the Antigravity 2.0 agentic desktop platform. Google made over 100 AI-related announcements across the event."
