- title: "DeepSeek Ships V4 — 1.6 Trillion Parameters, MIT License, Open Weights"
  date: "2026-04-24T09:00:00+08:00"
  description: "DeepSeek released DeepSeek V4-Pro (1.6 trillion parameters, 49 billion activated) and V4-Flash (284 billion parameters, 13 billion activated) under the MIT license as open weights, delivering near-frontier capabilities at a fraction of US lab pricing. Both models support a 1-million-token context window and feature a hybrid Compressed Sparse Attention architecture for efficient long-context handling. The release again reset market expectations for AI compute economics, as Chinese open-weight models continued to close the capability gap with closed Western frontier systems, extending DeepSeek's earlier pattern of structural pricing disruption."
  tags: ["Model", "Technical", "Economic"]
  organizations: ["DeepSeek"]
