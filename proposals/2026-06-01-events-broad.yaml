- title: "Meta Launches Muse Spark — First Proprietary Model, Reversing Open-Source-First Strategy"
  date: "2026-04-08T09:00:00-07:00"
  description: "Meta released Muse Spark through the newly formed Meta Superintelligence Labs, the company's first proprietary large language model — a structural reversal of the open-source-first strategy embodied by the Llama family. Muse Spark is a natively multimodal reasoning model with tool use, visual chain-of-thought reasoning, and multi-agent orchestration. Meta cited improved training techniques enabling near-flagship capability at 'an order of magnitude less compute' as the rationale, while offering only vague commitments to open-source future versions. The model began powering the Meta AI app and was slated to roll out across WhatsApp, Instagram, Facebook, and Messenger."
  tags: ["Model", "Corporate", "Product"]
