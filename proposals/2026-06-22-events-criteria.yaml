  description: "OpenAI closed the largest private funding round in corporate history, raising $122 billion at a post-money valuation of $852 billion. The round was led by Amazon ($50B), Nvidia ($30B), and SoftBank ($30B), with an unprecedented $3 billion raised directly from individual retail investors through bank channels. The company reported $2 billion in monthly revenue and 900 million weekly active users at closing, and the raise confirmed OpenAI as the most valuable private company in the world by a significant margin, setting expectations that its eventual IPO would exceed $1 trillion in market capitalization."

