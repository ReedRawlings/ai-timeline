  description: "A 20-year-old man from Spring, Texas, traveled to San Francisco and hurled an incendiary device at the gate of OpenAI CEO Sam Altman's $27 million home in Pacific Heights, igniting a fire before being arrested outside OpenAI's headquarters where he was attempting to shatter the building's glass doors. Authorities found a manifesto warning of humanity's 'extinction' at the hands of AI. The attack marked a violent escalation of AI backlash and prompted Altman to publish a personal statement saying he had 'underestimated the power of words and narratives' and calling for de-escalation of the rhetoric inside the AI industry. Fortune analysis noted the online response revealed a sharp generational divide, with younger users expressing sympathy for the attacker's grievances if not his methods."

