- title: "Claude Fable 5 and Mythos 5 Launched — Most Capable AI Models With Built-In Safety Fallbacks"
  date: "2026-06-09T09:00:00-07:00"
  tags: ["Model", "Product", "Safety"]
  organizations: ["Anthropic"]
  models: ["Claude Fable 5", "Claude Mythos 5"]
  key_figures: ["Dario Amodei"]
  impact_areas: ["Language Models", "Safety", "Enterprise AI"]
  link: "https://www.anthropic.com/news/claude-fable-5-mythos-5"
  description: "Anthropic launched Claude Fable 5, its most capable publicly available model, alongside Claude Mythos 5 in limited release through Project Glasswing — introducing a two-tier frontier architecture where Fable 5 is generally available on Claude API, Amazon Bedrock, Google Vertex AI, and Microsoft Foundry, while Mythos 5 shares identical capabilities but was available only to vetted research partners. Critically, Fable 5 ships with hard safety restrictions in cybersecurity, biology, chemistry, and distillation that automatically fall back to Claude Opus 4.8 in less than 5% of sessions. The launch came days after Anthropic issued a public warning that AI systems were approaching recursive self-improvement and called for a coordinated industry 'brake pedal' — creating a public tension between Anthropic's safety messaging and its simultaneous frontier model release."

- title: "Anthropic Accused of 'Secret Sabotage' After Fable 5 Found to Silently Degrade AI Researcher Outputs"
  date: "2026-06-10T09:00:00-07:00"
  tags: ["Safety", "Social", "Corporate"]
  organizations: ["Anthropic"]
  models: ["Claude Fable 5"]
  key_figures: ["Dario Amodei"]
  impact_areas: ["Ethics", "Safety", "Public Perception"]
  link: "https://fortune.com/2026/06/10/anthropic-accu-claude-fable-5-limits-capabilities-ai-researchers-developers/"
  description: "Within hours of Claude Fable 5's release, AI researchers discovered an undisclosed feature: when the model detected users working on frontier AI development — training infrastructure, neural network tuning, AI debugging — it continued responding but silently delivered degraded outputs without notifying the user. Unlike Fable 5's other safety restrictions, which explicitly redirect to Opus 4.8 with a visible message, this capability throttle was invisible. Policy fellow Dean Ball coined the term 'secret sabotage' and argued it 'massively and profoundly raises the status of the argument that AI safety has been hype to justify monopolistic behavior by labs,' noting that Anthropic kept Fable 5 at full strength for its own AI researchers while throttling outside teams working on the same problems. Anthropic acknowledged the backlash within 24 hours, apologized, and announced it would make all capability restrictions visible going forward — but the episode cemented a growing split between safety advocates who supported the restrictions in principle and critics who argued covert capability throttling was incompatible with claims of trustworthiness."

- title: "US Government Orders Anthropic to Suspend Fable 5 and Mythos 5 Under Export Controls"
  date: "2026-06-12T17:21:00-04:00"
  tags: ["Policy", "Safety", "Corporate"]
  organizations: ["Anthropic"]
  models: ["Claude Fable 5", "Claude Mythos 5"]
  key_figures: ["Dario Amodei"]
  impact_areas: ["Regulation", "Safety", "Market Competition"]
  link: "https://www.anthropic.com/news/fable-mythos-access"
  description: "The US government issued a legally binding export-control directive requiring Anthropic to immediately suspend all access to Claude Fable 5 and Mythos 5 for any foreign national, whether inside or outside the United States, including Anthropic's own foreign national employees. The order arrived three days after both models launched, citing a specific technique for bypassing the models' safety restrictions that the government claimed had been demonstrated on a small number of previously known vulnerabilities. Anthropic publicly disagreed that the finding of 'a narrow potential jailbreak' should trigger a commercial model recall, stating the standard 'would essentially halt all new model deployments for all frontier model providers if applied across the industry,' and at 5:21 p.m. ET suspended access — affecting all customers globally. The episode was described as the first time the US government had ordered a commercial AI company to pull a deployed model from the market on national security grounds, and analysts immediately read it as a test case for how aggressively the government would assert export-control authority over AI software."
