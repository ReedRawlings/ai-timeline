  description: "DeepSeek released V4 Preview as a fully open-sourced model split into two variants: V4-Pro with 1.6 trillion parameters (49B activated) and V4-Flash with 284B parameters (13B activated), both supporting a 1-million-token context window. The models achieved open-source state of the art on agentic coding benchmarks, trailed only Gemini 3.1 Pro on world-knowledge tasks, and outperformed all existing open models in math, STEM, and coding — rivaling top closed-source frontier models. The release continued DeepSeek's pattern of compressing capabilities that took Western labs months to develop into open-weight releases that immediately reset price-performance expectations across the industry."

- title: "Federal Court Blocks Colorado AI Law; DOJ and xAI Team Up to Challenge"
  date: "2026-04-27T09:00:00-06:00"
  tags: ["Policy", "Corporate"]
  organizations: ["xAI"]
  impact_areas: ["Regulation", "Market Competition"]
  link: "https://www.nortonrosefulbright.com/en-us/knowledge/publications/de3ad9de/xai-sues-doj-intervenes-enforcement-of-colorado-ai-act-suspended"
  description: "A federal magistrate judge in Colorado issued an order blocking the state from enforcing SB 205 — the nation's first comprehensive AI antidiscrimination law — after xAI filed a constitutional challenge arguing the law unconstitutionally burdened interstate commerce. In a rare alignment, the US Department of Justice also intervened in support of xAI's position, consistent with the Trump administration's stated goal of preempting state AI laws through federal action. The blocking order arrived just 64 days before the law's June 30 effective date and set the stage for a legislative rewrite, directly confirming the White House's strategy of using DOJ intervention and the threat of litigation to shape state-level AI governance before federal legislation could pass."

- title: "Colorado Repeals and Rewrites Its AI Act Under Federal Pressure"
  date: "2026-05-14T09:00:00-06:00"
  tags: ["Policy"]
  impact_areas: ["Regulation", "Ethics"]
  link: "https://www.crowell.com/en/insights/client-alerts/colorado-hits-reset-on-ai-regulation-sb-26-189-repeals-and-reenacts-the-colorado-ai-act"
  description: "Colorado Governor signed SB 26-189, repealing and fundamentally rewriting SB 205 — the nation's first comprehensive AI antidiscrimination law — before it could take effect. The rewrite replaced the law's comprehensive mandatory assessment regime with a notice-based approach, pushed the effective date to January 1, 2027, and required the attorney general to complete rulemaking first. The rollback came after a federal court suspended enforcement and the DOJ sided with xAI's constitutional challenge. Legal analysts noted the episode demonstrated that the Trump administration's strategy of using federal intervention to weaken state AI laws was working, and that Colorado's retreat would embolden similar challenges against AI legislation in other states."

