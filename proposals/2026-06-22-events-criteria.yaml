  description: "Apple announced Siri AI at WWDC 2026, a complete rebuild of its voice assistant powered by Google Gemini under the hood and housed in a standalone app, with deep system-wide personal context awareness across all Apple apps and operating systems. Alongside it, Apple released the second generation of Apple Foundation Models with multimodal speech, text, and image understanding, plus a suite of Apple Intelligence updates — AI reply suggestions in Messages, one-tap password updating, cross-app context awareness, and phone-call context pulled from Mail and Messages mid-call. The Gemini partnership extended the Apple-Google relationship into AI infrastructure, a striking reversal from Apple's prior strategy of building all AI models in-house, and confirmed Siri's decade-long lead had collapsed to the point that Apple needed to license a competitor's frontier model to stay relevant."

