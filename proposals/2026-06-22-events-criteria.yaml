  description: "OpenAI shipped GPT-5.5 just six weeks after GPT-5.4, with major gains in agentic coding, computer use, knowledge work, and research — available immediately to Plus, Pro, Business, and Enterprise users. President Greg Brockman framed the release as a step toward a unified 'super app' combining ChatGPT, Codex, and the Atlas browser into a single all-in-one agent-first environment. The API launched at $5 per million input tokens with a 1M context window; GPT-5.5 Pro launched at $30/$180 per million tokens. OpenAI's accelerating release cadence — roughly one major model every four to six weeks — marked a new phase in the AI arms race with OpenAI restructuring free-tier access to push users toward paid plans."

