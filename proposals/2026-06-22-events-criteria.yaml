  key_figures: ["Dario Amodei"]
  impact_areas: ["Market Competition", "Enterprise AI"]
  link: "https://techcrunch.com/2026/06/01/anthropic-files-to-go-public/"
  description: "Anthropic confidentially submitted a draft S-1 registration statement to the SEC, becoming the first major frontier AI lab to formally enter the public offering process. The filing came days after the company closed a $65 billion Series H funding round at a reported $965 billion private valuation and disclosed an annualized revenue run rate of $47 billion, driven by explosive enterprise adoption of Claude for coding and agentic workflows. The S-1 set up one of the most closely watched IPO races in history, as OpenAI was simultaneously preparing its own filing, and both companies' public debuts would represent the first opportunity for retail investors to own shares in the labs building the technology most analysts believed would define the next decade of computing."

- title: "Apple WWDC 2026: Siri Rebuilt With Gemini, Apple Intelligence Overhauled"
