- title: "Apple WWDC 2026: Siri Rebuilt on Gemini, Claude Becomes iPhone Option"
  date: "2026-06-08T10:00:00-07:00"
  tags: ["Corporate", "Product", "Social"]
  organizations: ["Apple", "Google", "Anthropic"]
  models: ["Gemini"]
  impact_areas: ["Multimodal AI", "Language Models", "Market Competition", "Public Perception"]
  key_figures: ["Tim Cook", "John Ternus"]
  link: "https://www.tomsguide.com/news/live/wwdc-2026-live-news-updates"
  description: "At WWDC 2026 — Tim Cook's farewell keynote before handing leadership to John Ternus — Apple announced a complete overhaul of Siri built on a 1.2-trillion-parameter custom Gemini model under a multi-year licensing deal reported at approximately $1 billion per year. The rebuilt Siri arrived as a standalone app supporting multi-step commands, persistent cross-device conversation history via iCloud, and image and document attachments. Apple simultaneously revealed an AI Extensions system in iOS 27, iPadOS 27, and macOS 27 allowing users to route questions to Claude, ChatGPT, or other third-party AI services from within Siri — making Claude the first competing AI assistant natively integrated into an iPhone. The announcements represented Apple's most significant AI pivot since it introduced Apple Intelligence in 2024, effectively conceding that its homegrown AI models could not match frontier commercial offerings."
