  description: "At Google Cloud Next '26 in Las Vegas, Google unveiled its eighth-generation TPUs alongside the Gemini Enterprise Agent Platform — a comprehensive system for building, scaling, governing, and optimizing AI agents at enterprise scale. The conference marked Google's most aggressive push yet into agentic enterprise AI, with announcements spanning an Agentic Data Cloud (cross-cloud Lakehouse and Knowledge Catalog), new storage and networking infrastructure for agent workloads, and AI models purpose-built for long-horizon task completion. The 8th-gen TPUs delivered substantially higher throughput per chip, addressing the compute bottleneck that had limited large-scale agent deployments."

