  description: "OpenAI announced the OpenAI Deployment Company ('DeployCo'), a standalone business unit co-led by TPG, Advent, Bain Capital, and Brookfield and backed by more than $4 billion from 19 global investment firms and consultancies. OpenAI simultaneously announced it had agreed to acquire Tomoro, an applied AI consulting firm, bringing ~150 Forward Deployed Engineers into the new entity from day one. The structure — a majority-OpenAI-controlled entity combining PE capital with OpenAI technology — was described as a direct answer to Anthropic's lead in enterprise accounts, and represented OpenAI's formal entry into the professional services market it had previously left to system integrators."

