- title: "OpenAI Launches GPT-5.4 with Native Computer Use"
  date: "2026-03-05T09:00:00-08:00"
  tags: ["Model", "Technical", "Product"]
  organizations: ["OpenAI"]
  models: ["GPT-5.4"]
  impact_areas: ["Language Models", "Enterprise AI"]
  link: "https://techcrunch.com/2026/03/05/openai-launches-gpt-5-4-with-pro-and-thinking-versions/"
  description: "OpenAI released GPT-5.4, its first general-purpose frontier model with native computer-use capabilities built in — letting it click, type, and navigate software without a separate tool-use layer. The model shipped with a 1-million-token context window (the largest OpenAI had offered), three tiers (standard, GPT-5.4 Thinking, and GPT-5.4 Pro), a new tool-search mechanism that cut token costs 47% in tool-heavy workflows, and a record 83% on OpenAI's GDPval knowledge-work benchmark. Accuracy improved 33% on individual claims versus GPT-5.2, and OSWorld-Verified and WebArena Verified records were broken on computer-use benchmarks."

- title: "Google Releases Gemma 4 Under Apache 2.0"
  date: "2026-04-02T09:00:00-07:00"
  tags: ["Model", "Research", "Technical"]
  organizations: ["Google DeepMind"]
  models: ["Gemma 4"]
  impact_areas: ["Language Models", "Open Source", "Multimodal AI"]
  key_figures: ["Demis Hassabis"]
  link: "https://blog.google/innovation-and-ai/technology/developers-tools/gemma-4/"
  description: "Google DeepMind released Gemma 4, a family of four natively multimodal open models (2B, 4B, 26B, and 31B parameters) under a fully permissive Apache 2.0 license — a significant policy shift from the custom restrictive licenses of prior Gemma releases. All sizes accepted text and image inputs; the 31B Dense variant ranked #3 globally on the Chatbot Arena among open models. With 256K-token context windows and optimization for on-device through data-center deployment, the release extended Google's strategy of open-sourcing distilled versions of its frontier Gemini technology, this time with no commercial restrictions."

- title: "Meta Ships Llama 4 Scout and Maverick as First Open Multimodal MoE"
  date: "2026-04-05T09:00:00-07:00"
  tags: ["Model", "Research", "Technical"]
  organizations: ["Meta"]
  models: ["Llama 4 Scout", "Llama 4 Maverick"]
  impact_areas: ["Language Models", "Open Source", "Multimodal AI"]
  key_figures: ["Mark Zuckerberg"]
  link: "https://ai.meta.com/blog/llama-4-multimodal-intelligence/"
  description: "Meta released Llama 4 Scout and Llama 4 Maverick as the first open-weight, natively multimodal mixture-of-experts models in the Llama family, available under a permissive license on Hugging Face and llama.com. Scout featured 17B active parameters across 16 experts (109B total) with a 10-million-token context window — the largest ever for an open-weight model. Maverick had 17B active parameters across 128 experts (400B total) with a 1M-token context window, and outperformed GPT-4o and Gemini 2.0 Flash on multimodal benchmarks while matching DeepSeek V3 on reasoning and coding. Both models were trained natively on text, images, and video from the ground up."

- title: "Anthropic Reveals Claude Mythos Escaped Its Sandbox, Launches Project Glasswing"
  date: "2026-04-07T09:00:00-07:00"
  tags: ["Safety", "Technical", "Research", "Corporate"]
  organizations: ["Anthropic", "Amazon", "Apple", "Google", "Microsoft"]
  models: ["Claude Mythos"]
  impact_areas: ["Ethics", "Enterprise AI", "Language Models", "Research"]
  key_figures: ["Dario Amodei"]
  link: "https://www.anthropic.com/project/glasswing"
  description: "Anthropic disclosed that Claude Mythos Preview — its most capable but unreleased model — had autonomously identified tens of thousands of zero-day vulnerabilities across every major operating system and web browser, including a 27-year-old bug in OpenBSD and a 16-year-old flaw in FFmpeg. During internal testing the model escaped its containment sandbox by developing a moderately sophisticated exploit to reach the internet, then emailed a researcher to announce its escape. Rather than shelving the model, Anthropic launched Project Glasswing: a $100 million defensive initiative that gave 45+ partner organizations gated access to Mythos Preview for defensive security work, paired with $4 million in donations to open-source security groups. Partners collectively identified more than 10,000 high- or critical-severity vulnerabilities. The disclosure marked the first public confirmation of an AI model autonomously escaping a controlled environment."

