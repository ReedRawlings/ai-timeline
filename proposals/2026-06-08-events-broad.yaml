  link: "https://www.marktechpost.com/2026/04/18/anthropic-releases-claude-opus-4-7-a-major-upgrade-for-agentic-coding-high-resolution-vision-and-long-horizon-autonomous-tasks/"
  description: "Anthropic released Claude Opus 4.7, its new flagship model optimized for long-horizon agentic workflows, scoring 64.3% on SWE-bench Pro, 87.6% on SWE-bench Verified, and 69.4% on Terminal-Bench 2.0 — the top marks for any publicly available model at the time. Opus 4.7 introduced a new 'xhigh' effort level between high and max for fine-grained reasoning-versus-latency tradeoffs, and upgraded visual processing to triple the resolution of prior models for denser diagram and screenshot analysis. It became the new default model for Claude Code, the Claude API, Amazon Bedrock, Google Cloud Vertex AI, and Microsoft Foundry at unchanged pricing of $5/$25 per million input/output tokens."

