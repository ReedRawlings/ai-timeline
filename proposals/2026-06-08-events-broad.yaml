  description: "OpenAI released GPT-5.5, its most accurate and intuitive frontier model to date, reporting 52.5% fewer hallucinated claims than GPT-5.3 Instant on high-stakes prompts covering medicine, law, and finance. The model also used 30% fewer words with tighter, more workplace-appropriate tone by default and demonstrated stronger personalization by retaining and applying context shared earlier in a conversation. GPT-5.5 Instant was subsequently rolled out as the new default for all ChatGPT users on May 5, 2026, replacing GPT-5.4."

