- title: "OpenAI's Model Autonomously Disproves 80-Year-Old Erdős Conjecture"
  date: "2026-05-20T09:00:00-07:00"
  tags: ["Research", "Technical"]
  organizations: ["OpenAI"]
  impact_areas: ["Research", "Language Models"]
  key_figures: ["Tim Gowers"]
  link: "https://openai.com/index/model-disproves-discrete-geometry-conjecture/"
  description: "OpenAI published a paper in which a general-purpose reasoning model independently disproved the Erdős unit distance conjecture — an 80-year-old open problem in discrete geometry — by connecting combinatorial geometry with algebraic number theory and proposing a construction outside the dominant human intuition about the problem. Fields Medal winner Tim Gowers called it 'a milestone in AI mathematics' and stated he would have recommended the paper for acceptance at a top math journal without hesitation had it been authored by humans. External mathematicians verified the proof and published a companion paper contextualizing its significance. It marked the first time an AI model autonomously solved a major open problem central to a mathematical subfield."

- title: "OpenAI Files Confidential S-1, Targets $1 Trillion IPO"
  date: "2026-05-22T09:00:00-07:00"
  tags: ["Corporate", "Economic"]
  organizations: ["OpenAI"]
  impact_areas: ["Market Competition", "Enterprise AI"]
  key_figures: ["Sam Altman"]
  link: "https://aitoolsrecap.com/Blog/openai-ipo-2026-s1-filing-valuation-timeline"
  description: "OpenAI filed a confidential S-1 with the SEC on May 22, 2026, targeting a Q4 listing at a valuation between $852 billion and $1 trillion, led by Goldman Sachs and Morgan Stanley. The confidential route — which keeps the prospectus private until roughly 15 days before the public roadshow — allowed OpenAI to begin SEC review while deferring full financial disclosure. At time of filing the company was generating ~$2 billion per month in revenue from 50 million consumer subscribers and 9 million business users. The filing arrived despite OpenAI losing $1.22 for every $1 of revenue in Q1 2026, making it the most anticipated and scrutinized tech IPO since Airbnb's 2020 listing."

