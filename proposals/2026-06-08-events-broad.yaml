  description: "DeepSeek released V4 as a fully open-weight, trillion-parameter mixture-of-experts model with only ~37 billion active parameters per token, a 1-million-token context window powered by its Engram conditional memory system, and native multimodal generation across text, images, and video. API pricing for deepseek-v4-flash and deepseek-v4-pro ran 10–50x cheaper than GPT-5.4 and Claude Opus 4.7 at comparable capability tiers. V4 scored 81% on SWE-bench and represented the largest open-weight release in AI history, continuing the pattern DeepSeek established with V3 of delivering frontier-adjacent capability at a fraction of Western competitors' prices."

