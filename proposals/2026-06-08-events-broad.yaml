- title: "EU AI Act Omnibus: High-Risk Deadlines Extended to 2027–2028"
  date: "2026-05-07T09:00:00+01:00"
  tags: ["Policy", "Research"]
  impact_areas: ["Regulation", "Enterprise AI", "Ethics"]
  link: "https://www.consilium.europa.eu/en/press/press-releases/2026/05/07/artificial-intelligence-council-and-parliament-agree-to-simplify-and-streamline-rules/"
  description: "The European Council presidency and European Parliament negotiators reached a provisional agreement on the Digital AI Omnibus, extending the EU AI Act's enforcement deadline for standalone high-risk AI systems from August 2026 to December 2, 2027, and for AI embedded in regulated products from August 2026 to August 2, 2028. The agreement also added targeted prohibitions — including a ban on AI-generated non-consensual intimate imagery — and introduced new transparency obligations for AI training datasets. After a first trilogue round on April 28 failed, the May 7 deal was confirmed by Member State representatives on May 13, setting the stage for formal adoption. Industry groups called the extension the most significant relief measure for enterprise AI compliance since the Act passed."

