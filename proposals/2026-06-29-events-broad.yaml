  description: "The Trump administration partially lifted its export-control directive against Anthropic's Mythos 5, allowing the model to be released to a narrow set of vetted trusted partners and critical infrastructure defenders — two weeks after forcing the model offline globally. The partial reinstatement followed the administration's broader AI innovation executive order and came on the same day OpenAI previewed GPT-5.6 Sol, Terra, and Luna in limited government-gated access, establishing a new pattern in which the most capable frontier models now debut under US national security review rather than open commercial release."

