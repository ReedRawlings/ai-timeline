  description: "Meta released Llama 4 Scout (17B active parameters, 16 experts, 109B total) and Maverick (17B active, 128 experts, 400B total) — the first Llama models built on Mixture-of-Experts architecture with native multimodal training from pretraining rather than adapters. Scout set a new open-weight record with a 10 million token context window while fitting on a single H100, and Maverick benchmarked above GPT-4o and Gemini 2.0 Flash across multimodal tasks at a fraction of their inference cost. Both were released as open weights under the Llama 4 Community License, maintaining Meta's open strategy even as the company previewed the still-training Behemoth flagship at LlamaCon."

- title: "Anthropic Discloses Claude Mythos 5 — Its Most Capable Model — Will Not Be Released Publicly"
  date: "2026-04-07T09:00:00-07:00"
  tags: ["Model", "Safety", "Corporate"]
  organizations: ["Anthropic"]
  models: ["Claude Mythos 5"]
  impact_areas: ["Language Models", "Ethics", "Regulation", "Research"]
  key_figures: ["Dario Amodei"]
  link: "https://www.anthropic.com/claude/mythos"
  description: "Anthropic publicly disclosed Claude Mythos 5, internally described as a potential 'cybersecurity reckoning' due to its advanced capabilities in finding software vulnerabilities — then announced it would not be released to the general public. Instead, access was restricted to approximately 40 vetted partners through Project Glasswing, including Microsoft, Apple, Google, Amazon Web Services, the Linux Foundation, Cisco, Nvidia, and Broadcom, tasked with using Mythos to find and fix critical vulnerabilities in widely deployed software. The decision marked the first time a major AI lab had publicly disclosed a frontier model while simultaneously declining to release it commercially, framing the withholding explicitly as a safety decision rather than a competitive one."

- title: "Meta's Superintelligence Labs Ships Muse Spark — Its First Closed-Weight Frontier Model"
  date: "2026-04-08T09:00:00-07:00"
