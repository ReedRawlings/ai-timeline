  impact_areas: ["Language Models", "Market Competition", "Open Source"]
  key_figures: ["Mark Zuckerberg"]
  link: "https://about.fb.com/news/2026/04/introducing-muse-spark-meta-superintelligence-labs/"
  description: "Meta's newly formed Superintelligence Labs launched Muse Spark — a natively multimodal reasoning model accepting voice, text, and image — as a closed-weight proprietary model, with its architecture, weights, and training code withheld. The release marked a dramatic reversal of Meta's longstanding open-source identity: where Llama had been released as open weights, Muse Spark treats frontier AI as commercial IP available free via meta.ai but closed to inspection. The model ranked fourth globally on the AI Intelligence Index and first on HealthBench Hard, and was deployed immediately across Facebook, Instagram, WhatsApp, Messenger, and Meta's Ray-Ban smart glasses — while the 2T-parameter Llama 4 Behemoth flagship was quietly shelved mid-training."

- title: "OpenAI's Internal Model Autonomously Disproves 80-Year-Old Erdős Geometry Conjecture"
  date: "2026-05-20T09:00:00-07:00"
  tags: ["Research", "Technical"]
  organizations: ["OpenAI"]
  impact_areas: ["Research", "Language Models"]
  link: "https://openai.com/index/model-disproves-discrete-geometry-conjecture/"
  description: "OpenAI announced that an internal general-purpose reasoning model had independently disproved the planar unit distance problem — a central conjecture in discrete geometry posed by Paul Erdős in 1946 that asked how many pairs of points separated by exactly distance 1 could be packed into n planar points. The model constructed an infinite family of examples using deep algebraic number theory (Golod-Shafarevich theory and infinite class field towers) that achieve a polynomial improvement over the square grids mathematicians had long considered optimal, later refined by Princeton mathematician Will Sawin to n^(1+0.014) unit-distance pairs. External mathematicians verified the proof, and Scientific American described it as the first time AI had autonomously disproved a prominent open problem central to a mathematical subfield — a categorical step beyond assisting human proofs."

- title: "Pope Leo XIV Publishes Magnifica Humanitas — First Papal Encyclical on AI"
  date: "2026-05-25T09:00:00+01:00"
  tags: ["Social", "Policy"]
  impact_areas: ["Public Perception", "Ethics", "Regulation"]
  key_figures: ["Pope Leo XIV"]
  link: "https://www.vatican.va/content/leo-xiv/en/encyclicals/documents/20260515-magnifica-humanitas.html"
  description: "Pope Leo XIV released Magnifica Humanitas ('Magnificent Humanity'), a 42,300-word encyclical signed May 15 and released May 25 that became the first papal encyclical in history dedicated primarily to artificial intelligence. The document argued that technology is never neutral because it takes on the characteristics of those who devise, finance, and regulate it, and called on governments and technology leaders to 'disarm' AI before it exacerbates inequality, weakens human relationships, and threatens peace. While acknowledging AI is not inherently evil, it urged guardrails ensuring AI eases rather than concentrates power, and positioned AI ethics as a religious imperative — drawing comparisons to Rerum Novarum's role in shaping Catholic social teaching around industrial labor."

