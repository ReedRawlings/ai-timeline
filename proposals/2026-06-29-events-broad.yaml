- title: "Claude Fable 5 Launches — Then US Government Forces It Offline Three Days Later"
  date: "2026-06-09T09:00:00-07:00"
  tags: ["Model", "Policy", "Safety", "Corporate"]
  organizations: ["Anthropic"]
  models: ["Claude Fable 5", "Claude Mythos 5"]
  impact_areas: ["Language Models", "Regulation", "Ethics", "Market Competition"]
  key_figures: ["Dario Amodei"]
  link: "https://www.anthropic.com/news/claude-fable-5-mythos-5"
  description: "Anthropic launched Claude Fable 5 on June 9 — a Mythos-class model for general availability, priced at $10/$50 per million tokens and included free for all Pro, Max, Team, and Enterprise subscribers through June 22 — only to have the US government issue an export-control directive on June 12 requiring Anthropic to suspend global access within hours, citing a reported jailbreak that could allow Fable 5 to assist in identifying software vulnerabilities. Since Anthropic could not verify user citizenship in real time, it disabled both Fable 5 and Mythos 5 for all users worldwide. Anthropic publicly disputed the standard, arguing that if a narrow jailbreak finding triggered a commercial model recall, it would effectively halt all new model deployments across the industry — marking the first time a US government directive had forced a frontier AI model into full commercial withdrawal."

