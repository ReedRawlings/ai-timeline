  description: "OpenAI previewed the GPT-5.6 series on June 26 in a tiered three-model family: Sol (flagship for hard problems, $5/$30 per million tokens), Terra (balanced business model, $2.50/$15), and Luna (fast everyday model, $1/$6) — releasing access initially to roughly 20 vetted organizations after sharing the models and release plans with the US government. The architecture represented the most significant model-design change since GPT-5, with strengthened safety protections for higher-risk activity and sensitive cyber requests. The government-gated debut pattern, mirrored by Anthropic's Mythos 5 reinstatement the same day, signaled a structural shift in how the most capable frontier models enter the market."
