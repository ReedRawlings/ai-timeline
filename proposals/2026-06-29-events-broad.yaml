- title: "Judge Blocks Pentagon's Anthropic Ban, Cites First Amendment Retaliation"
  date: "2026-03-26T14:00:00-07:00"
  tags: ["Policy", "Safety", "Corporate"]
  organizations: ["Anthropic", "Pentagon"]
  impact_areas: ["Regulation", "Ethics"]
  key_figures: ["Dario Amodei"]
  link: "https://www.cnbc.com/2026/03/26/anthropic-pentagon-dod-claude-court-ruling.html"
  description: "Federal Judge Rita Lin granted Anthropic a preliminary injunction blocking the Trump administration's Pentagon blacklisting and presidential directive banning federal agencies from using Claude, ruling that 'punishing Anthropic for bringing public scrutiny to the government's contracting position is classic illegal First Amendment retaliation' and that the reasons given for designating Anthropic a supply chain risk were 'pretextual.' The injunction paused enforcement of the national-security designation while the underlying case proceeded — a landmark ruling that applied First Amendment doctrine to AI procurement disputes and set a precedent for how courts could review executive branch retaliation against AI companies."

