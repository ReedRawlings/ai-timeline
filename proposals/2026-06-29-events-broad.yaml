  description: "ChatGPT crossed one billion global monthly active app users in May 2026, roughly three years after launch, making it the fastest application in history to reach the milestone — outpacing Google Maps, TikTok, Instagram, and YouTube by years. Sensor Tower data reported by Reuters confirmed the figure as OpenAI simultaneously disclosed 900 million weekly active users and $2 billion in monthly revenue. The milestone arrived alongside OpenAI's IPO preparations and reshaped analyst models for the platform's addressable market, with the median economic value per user estimated to have tripled between 2025 and 2026 per Stanford's AI Index."

