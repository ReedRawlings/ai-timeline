  description: "Anthropic disclosed that its most capable model to date, Claude Mythos Preview, could find and exploit software vulnerabilities at a level surpassing most human security researchers — including a flaw in the wolfSSL cryptography library — and deemed it too dangerous to release through its standard commercial API. Instead of shipping it, Anthropic launched Project Glasswing, a defensive-security initiative giving curated early access to roughly a dozen major companies. The first time a frontier lab withheld a completed flagship model purely over offensive cyber capability."

