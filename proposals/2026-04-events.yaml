- title: "Anthropic Withholds Claude Mythos, Launches Project Glasswing"
  date: "2026-04-07T09:00:00-07:00"
  tier: major
  tags: ["Model", "Safety", "Technical", "Corporate", "Partnership"]
  organizations: ["Anthropic", "AWS", "Apple", "Cisco", "CrowdStrike", "Google", "JPMorgan Chase", "Microsoft", "NVIDIA", "Palo Alto Networks"]
